<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - STICA Clinic</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <!-- CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --sti-blue: #0072bc;
            --sti-yellow: #fdb913;
        }

        body {
            font-family: 'Schibsted Grotesk', sans-serif;
            background-color: #f4f6f9;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: white;
            z-index: 1000;
            transition: all 0.3s;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            height: 60px;
            background: var(--sti-blue);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            color: white;
        }

        .sidebar-menu {
            padding: 1rem 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 0.8rem 1.5rem;
            color: #555;
            text-decoration: none;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .menu-item:hover,
        .menu-item.active {
            background: #f8f9fa;
            color: var(--sti-blue);
            border-left-color: var(--sti-blue);
        }

        .menu-item i {
            width: 25px;
            margin-right: 10px;
        }

        /* Content Area */
        .main-content {
            margin-left: 250px;
            transition: all 0.3s;
        }

        /* Navbar */
        .navbar-custom {
            background: var(--sti-blue);
            height: 60px;
        }

        /* Metric Cards */
        .metric-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                margin-left: -250px;
            }

            .sidebar.active {
                margin-left: 0;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h5 class="mb-0 fw-bold">STICA CLINIC</h5>
            <button class="btn text-white d-md-none ms-auto" onclick="toggleSidebar()"><i
                    class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-menu">
            <div class="px-3 mb-2 small text-muted fw-bold">MAIN MENU</div>
            <a href="dashboard.html" class="menu-item active"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="students.html" class="menu-item"><i class="fas fa-user-graduate"></i> Students</a>
            <a href="employees.html" class="menu-item"><i class="fas fa-users"></i> Employees</a>
            <a href="inventory.html" class="menu-item"><i class="fas fa-pills"></i> Inventory</a>
            <a href="logs.html" class="menu-item"><i class="fas fa-clipboard-list"></i> Audit Logs</a>

            <div class="px-3 mt-4 mb-2 small text-muted fw-bold">SYSTEM</div>
            <a href="#" class="menu-item" onclick="MockAuth.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar navbar-custom px-3">
            <div class="d-flex align-items-center w-100">
                <button class="btn text-white me-3 d-md-none" onclick="toggleSidebar()"><i
                        class="fas fa-bars"></i></button>
                <span class="text-white fw-bold d-none d-md-block">Dashboard</span>
                <div class="ms-auto text-white d-flex align-items-center">
                    <i class="fas fa-user-circle fa-lg me-2"></i>
                    <span id="userNameDisplay">User</span>
                </div>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <!-- Stats Row -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card metric-card">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-primary bg-opacity-10 text-primary me-3">
                                <i class="fas fa-user-graduate"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Total Students</h6>
                                <h3 class="fw-bold mb-0" id="countStudents">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card metric-card">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-success bg-opacity-10 text-success me-3">
                                <i class="fas fa-users"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Total Employees</h6>
                                <h3 class="fw-bold mb-0" id="countEmployees">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card metric-card">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-warning bg-opacity-10 text-warning me-3">
                                <i class="fas fa-pills"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Low Stock Meds</h6>
                                <h3 class="fw-bold mb-0" id="countLowStock">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card metric-card">
                        <div class="card-body d-flex align-items-center">
                            <div class="icon-box bg-info bg-opacity-10 text-info me-3">
                                <i class="fas fa-user-md"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Active Visits</h6>
                                <h3 class="fw-bold mb-0">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h6 class="fw-bold mb-0 text-primary"><i class="fas fa-history me-2"></i>Recent Activity</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">Time</th>
                                    <th>Action</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody id="recentLogs">
                                <!-- JS populated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="js/mock_db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Auth Check
        const user = MockAuth.checkSession();
        if (user) document.getElementById('userNameDisplay').innerText = user.name;

        // Mobile Toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Load Data
        function loadDashboard() {
            const students = MockDB.get('students');
            const employees = MockDB.get('employees');
            const meds = MockDB.get('medicines');
            const logs = MockDB.get('logs');

            document.getElementById('countStudents').innerText = students.length;
            document.getElementById('countEmployees').innerText = employees.length;
            document.getElementById('countLowStock').innerText = meds.filter(m => m.stock <= 10).length;

            const tbody = document.getElementById('recentLogs');
            let html = '';
            logs.slice(0, 5).forEach(log => {
                html += `<tr>
                <td class="ps-4 small text-muted">${log.dateTime}</td>
                <td><span class="badge bg-light text-dark border">${log.action}</span></td>
                <td>${log.details}</td>
            </tr>`;
            });
            tbody.innerHTML = html;
        }

        loadDashboard();
    </script>

</body>

</html>
